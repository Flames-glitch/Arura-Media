name: Aurora Media - Signed Update APK

on:
  workflow_dispatch:
    inputs:
      source_archive:
        description: 'Optional exact source ZIP filename (leave blank for latest)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      REQUESTED_ARCHIVE: ${{ inputs.source_archive || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select, validate and extract source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          import os, re
          archives = list(Path('.').glob('AuroraMedia_GitHub_Repo_v*.zip'))
          def key(path):
              match = re.fullmatch(r'AuroraMedia_GitHub_Repo_v(\d+(?:\.\d+)*)(?:_(.*))?\.zip', path.name)
              if not match:
                  return ((-1,), '')
              return (tuple(map(int, match.group(1).split('.'))), match.group(2) or '')
          requested = os.environ.get('REQUESTED_ARCHIVE', '').strip()
          if requested:
              source = Path(requested)
              if source.name != requested or source not in archives:
                  raise SystemExit('::error::Requested source ZIP not found in repository root')
          else:
              if not archives:
                  raise SystemExit('::error::No Aurora Media source ZIPs found in repository root')
              source = max(archives, key=key)
          print('Selected source:', source.name)
          try:
              with ZipFile(source) as archive:
                  if archive.testzip() is not None:
                      raise SystemExit('::error::Source ZIP failed integrity check')
                  for item in archive.infolist():
                      p = Path(item.filename)
                      if p.is_absolute() or '..' in p.parts or not item.filename.startswith('AuroraMedia_GitHub_Repo/'):
                          raise SystemExit('::error::Unsafe or unexpected ZIP path')
                  archive.extractall('extracted')
          except BadZipFile:
              raise SystemExit('::error::Invalid source ZIP')
          project = Path('extracted/AuroraMedia_GitHub_Repo')
          required = ('settings.gradle.kts', 'app/build.gradle.kts', 'tools/verify_project.py')
          if any(not (project / name).is_file() for name in required):
              raise SystemExit('::error::ZIP does not contain a complete Aurora Media Android project')
          content = (project / 'app/build.gradle.kts').read_text()
          ver = re.search(r'versionName\s*=\s*"([^"]+)"', content)
          version = ver.group(1) if ver else 'unknown'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('archive=' + source.name, file=output)
              print('version=' + version, file=output)
          if os.environ.get('GITHUB_REPOSITORY') == 'Flames-glitch/Arura-Media':
              settings = (project / 'app/src/main/java/com/aurora/media/data/SecureSettings.kt')
              if settings.exists():
                  code = settings.read_text()
                  match = re.search(r'preferences\.contains\("password"\).*?\belse\s+"([^"]+)"', code, re.S)
                  if match and match.group(1):
                      print('::warning::Selected archive contains a default FTP password and the repository is public. Rotate that credential; use a secure source release.')
          PY
          python3 extracted/AuroraMedia_GitHub_Repo/tools/verify_project.py

      - name: Restore permanent signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.AURORA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo '::error::Add AURORA_KEYSTORE_B64 and AURORA_KEYSTORE_PASSWORD to Settings > Secrets and variables > Actions.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/aurora-signing"
          p12="$RUNNER_TEMP/aurora-signing/aurora-media.p12"
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$p12"; then
            echo '::error::AURORA_KEYSTORE_B64 is invalid. Copy the complete base64 from your private .p12 keystore.'
            exit 1
          fi
          chmod 600 "$p12"
          if ! keytool -list -storetype PKCS12 -keystore "$p12" -storepass "$KEYSTORE_PASSWORD" -alias aurora-media >/dev/null 2>&1; then
            echo '::error::Keystore/password invalid or alias aurora-media missing.'
            exit 1
          fi
          echo "AURORA_SIGNING_KEYSTORE=$p12" >> "$GITHUB_ENV"
          echo 'Signing key restored and validated.'
      
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Confirm Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$manager" ]]; then manager=$(command -v sdkmanager); fi
            "$manager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Run tests and build debug APK
        working-directory: extracted/AuroraMedia_GitHub_Repo
        env:
          AURORA_SIGNING_PASSWORD: ${{ secrets.AURORA_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK signature
        run: |
          apk=extracted/AuroraMedia_GitHub_Repo/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: AuroraMedia-SIGNED-v${{ steps.source.outputs.version }}-APK
          path: extracted/AuroraMedia_GitHub_Repo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Aurora Media Android build"
            echo "Source: \`${{ steps.source.outputs.archive }}\`"
            echo "App version: \`${{ steps.source.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
