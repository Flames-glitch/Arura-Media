
name: Build Aurora Media APK (ZIP Upload)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AuroraMedia_GitHub_Repo_v*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract latest Aurora Media ZIP
        shell: bash
        run: |
          shopt -s nullglob
          archives=(AuroraMedia_GitHub_Repo_v*.zip)

          if (( ${#archives[@]} == 0 )); then
            echo "::error::Aurora Media ZIP not found"
            exit 1
          fi

          archive=$(printf '%s\n' "${archives[@]}" | sort -V | tail -n 1)

          echo "Using $archive"
          unzip -q "$archive" -d extracted

          test -f extracted/AuroraMedia_GitHub_Repo/settings.gradle.kts
          test -f extracted/AuroraMedia_GitHub_Repo/app/build.gradle.kts

      - name: Fix LibVLC subtitle API
        shell: bash
        run: |
          file=extracted/AuroraMedia_GitHub_Repo/app/src/main/java/com/aurora/media/player/VlcSession.kt

          test -f "$file"

          if grep -q 'Media.Slave.Type.Subtitle' "$file"; then
            sed -i 's/Media\.Slave\.Type\.Subtitle/0/g' "$file"
            echo "LibVLC subtitle API corrected"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK 35
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"

          if [[ -f "$ANDROID_HOME/platforms/android-35/android.jar" && -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            echo "Android SDK 35 already installed"
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

            if [[ ! -x "$SDKMANAGER" ]]; then
              SDKMANAGER="$(command -v sdkmanager)"
            fi

            for attempt in 1 2 3; do
              if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'; then
                break
              fi

              echo "SDK installation attempt $attempt failed"
              sleep 10
            done

            test -f "$ANDROID_HOME/platforms/android-35/android.jar"
            test -d "$ANDROID_HOME/build-tools/35.0.0"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted/AuroraMedia_GitHub_Repo
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AuroraMedia-debug-APK
          path: extracted/AuroraMedia_GitHub_Repo/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
